name: CI

on:
  push:
  pull_request:

jobs:
  arch:
    name: Build and test on Arch Linux
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git rust webkitgtk-6.0 gtk4 libadwaita \
            xorg-server-xvfb xdotool python-gobject at-spi2-core imagemagick ttf-dejavu
      - uses: actions/checkout@v4
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --locked --bin wisp
      - name: End-to-end tests
        run: |
          if ! command -v hyprctl >/dev/null 2>&1; then
            echo "hyprctl is absent; skipping the Hyprland end-to-end job"
            exit 0
          fi
          tests/e2e/run.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-screenshots
          path: target/e2e/
      - name: Release build
        run: cargo build --locked --release
      - uses: actions/upload-artifact@v4
        with:
          name: wisp-x86_64
          path: target/release/wisp
